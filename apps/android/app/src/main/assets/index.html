html,body{max-width:100%;overflow-x:hidden}.warn{overflow-wrap:anywhere;word-break:break-word}.native-actions .actions{display:none}.native-actions main{padding-bottom:28px}.native-actions #toast{bottom:20px}</style></head><body data-pane="setup"><header><div class="top"><div class="brand"><span class="mark"></span>PhantomResume</div><button class="menu" onclick="drawer(true)" aria-label="Open all tools">☰</button></div><div class="workspace"><span>Your document workspace</span><span class="local-dot">On your device</span></div></header><main><div class="toolbar"><button onclick="drawer(true)">Explore 37 tools</button><button onclick="sample()">＋ Try a sample</button></div><div id="content"></div><p class="footer">Files stay on this device. Network tools contact only the URL you enter. No application submissions.</p><label class="settings"><input type="checkbox" id="motion" onchange="document.body.classList.toggle('reduced',this.checked);localStorage.setItem('reduced',this.checked)">Reduce motion</label></main><div class="actions"><div class="action-inner"><button id="run" onclick="run()">Create injected copy →</button><button id="cancel" onclick="Native.cancel()">Cancel</button></div></div><div id="drawer" onclick="if(event.target===this)drawer(false)"><nav><div class="top"><h2>Your tools</h2><button style="width:auto" onclick="drawer(false)">✕</button></div><input id="search" placeholder="Find a tool…" oninput="renderNav(this.value)"><div id="navtools"></div><div class="drawer-footer"><button onclick="sample();drawer(false)">Try a sample resume</button><button onclick="runSelftest();drawer(false)">Run local self-check</button><button onclick="Native.close()">Close app</button></div></nav></div><div id="toast"></div><script src="catalog.js"></script><script>
if(typeof Native.setAction==='function')document.body.classList.add('native-actions');
let tools=CATALOG,current=tools[0],stored={},busy=false,lastResult=null,shared='',resultTab='overview';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function drawer(show){document.getElementById('drawer').classList.toggle('open',show);document.body.style.overflow=show?'hidden':'';if(show)renderNav('')}
function renderNav(filter=''){let group='';document.getElementById('navtools').innerHTML=tools.filter(t=>(t.title+' '+t.description).toLowerCase().includes(filter.toLowerCase())).map(t=>{let h=t.group!==group?`<div class="group">${esc(t.group)}</div>`:'';group=t.group;return h+`<button class="${current.key===t.key?'active':''}" onclick="select('${t.key}')">${esc(t.title)}</button>`}).join('')}
function values(){let p={};current.fields.forEach(f=>{let e=document.getElementById('f_'+f.key);if(f.kind==='checks')p[f.key]=[...document.querySelectorAll(`[data-group="${f.key}"]:checked`)].map(x=>x.value);else p[f.key]=f.kind==='bool'?e.checked:['file','folder'].includes(f.kind)?(e.dataset.path||''):e.value});return p}
function select(key){if(busy){toast('Wait for the current task, or cancel it.');return}if(document.getElementById('f_'+current.fields[0]?.key))stored[current.key]=values();current=tools.find(t=>t.key===key);lastResult=null;render();setPane('setup');drawer(false);window.scrollTo({top:0,behavior:motionBehavior()})}
function field(f){let val=stored[current.key]?.[f.key]??f.default;if(f.key==='input'&&!val)val=shared;let label=`<label for="f_${f.key}">${esc(f.label)}${f.required?' *':''}</label>`;let input='';
if(['file','folder'].includes(f.kind))input=`<div class="picker"><input id="f_${f.key}" readonly data-path="${esc(val)}" value="${esc(String(val||'').split(/[\\/]/).pop())}" placeholder="${esc(f.hint||'Choose files…')}"><button onclick="Native.pick('${f.key}',${f.kind==='folder'})">Choose</button></div>`;
else if(f.kind==='area')input=`<textarea id="f_${f.key}" placeholder="${esc(f.hint)}">${esc(val)}</textarea>`;
else if(f.kind==='choice')input=`<select id="f_${f.key}" onchange="modeChanged('${f.key}')">${f.options.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
else if(f.kind==='bool'){label='';input=`<label class="check"><input type="checkbox" id="f_${f.key}" ${val?'checked':''} onchange="modeChanged('${f.key}')">${esc(f.label)}</label>`}
else if(f.kind==='checks')input=`<div class="quick"><button onclick="allChannels('${f.key}',true)">All channels</button><button onclick="allChannels('${f.key}',false)">Clear</button></div><div class="checks">${f.options.map(o=>`<label class="check"><input type="checkbox" data-group="${f.key}" value="${o}" ${val.includes(o)?'checked':''} onchange="if(document.getElementById('f_custom'))document.getElementById('f_custom').checked=true">${esc(o.replaceAll('_',' '))}</label>`).join('')}</div>`;
else input=`<input id="f_${f.key}" value="${esc(val)}" placeholder="${esc(f.hint)}">`;return `<div class="field">${label}${input}</div>`}
function render(){document.getElementById('content').innerHTML=`<div class="appear"><div class="eyebrow">${esc(current.group.charAt(0)+current.group.slice(1).toLowerCase())}</div><h2 class="title">${esc(current.title)}</h2><p class="desc">${esc(current.description)}</p><div class="pane-tabs"><button id="tab-setup" class="active" onclick="setPane('setup')">Set up</button><button id="tab-results" onclick="setPane('results')">Results & files</button></div><div class="columns"><section class="card" id="setup"><h3>Set up your run <span class="step">01</span></h3>${current.fields.map(field).join('')}${current.note?`<p class="note">${esc(current.note)}</p>`:''}<div class="spinner" id="spinner"></div><p class="status" id="status">New files are saved in a separate run folder.</p></section><section class="card" id="results"><h3>Results <span class="step">02</span></h3><div class="empty"><div class="sheet"></div><strong>A clearer view starts here.</strong><p>Choose your file and run a tool.<br>Your results and exports appear here.</p></div></section></div></div>`;document.getElementById('run').textContent=current.button+' →';if(typeof Native.setAction==='function')Native.setAction(current.button,busy);modeChanged('mode')}
function modeChanged(key){if(!['mode','custom'].includes(key)||!document.getElementById('f_custom')||document.getElementById('f_custom').checked)return;let mode=document.getElementById('f_mode').value;let selected=mode==='nuclear'?current.fields.find(f=>f.key==='channels').options:mode==='aggressive'?['metadata','hidden_text','comments','zero_width','image','qr']:['metadata'];document.querySelectorAll('[data-group="channels"]').forEach(e=>e.checked=selected.includes(e.value))}
function allChannels(group,checked){document.querySelectorAll(`[data-group="${group}"]`).forEach(e=>e.checked=checked);if(group==='channels'){document.getElementById('f_custom').checked=true;if(checked)document.getElementById('f_mode').value='nuclear'}}
function setBusy(state){busy=state;if(typeof Native.setAction==='function')Native.setAction(current.button,state);document.getElementById('run').disabled=state;document.getElementById('cancel').style.display=state?'block':'none';let s=document.getElementById('spinner');if(s)s.style.display=state?'block':'none'}
function run(){if(busy)return;let p=values();let missing=current.fields.find(f=>f.required&&!p[f.key]);if(missing){toast(missing.label+' is required.');return}stored[current.key]=p;setBusy(true);Native.run(current.key,JSON.stringify(p))}
function sample(){if(busy)return;setBusy(true);Native.run('_sample','{}')}
function runSelftest(){if(busy)return;setBusy(true);Native.run('_selftest','{}')}
function toast(text){let el=document.getElementById('toast');el.textContent=text;el.style.display='block';setTimeout(()=>el.style.display='none',4000)}
window.receive=function(type,payload){if(type==='file'){let e=document.getElementById('f_'+payload.key);if(e){e.value=payload.name;e.dataset.path=payload.path;e.title=payload.name}if(payload.key==='input')shared=payload.path;toast(payload.name+' imported');return}if(type==='progress'){setBusy(true);document.getElementById('status').textContent=payload;return}if(type==='notice'){toast(payload);return}setBusy(false);if(type==='failure'){setPane('results');document.getElementById('status').textContent='Needs attention';document.getElementById('results').innerHTML='<h3>Run stopped</h3><p class="warn">'+esc(payload)+'</p>';return}if(type==='result'){if(payload.sample){shared=payload.sample;stored.review={input:shared};current=tools.find(t=>t.key==='review');render();setPane('setup');toast('Sample ready. Tap Review resume to begin.');return}lastResult=payload;resultTab='overview';showResult();setPane('results');document.getElementById('status').textContent='Complete';document.querySelector('.pane-tabs').scrollIntoView({behavior:motionBehavior(),block:'start'})}};
function showResult(){let r=lastResult,d=r.data||r;let content='';if(resultTab==='details')content='<pre>'+esc(JSON.stringify(d,null,2))+'</pre>';else if(resultTab==='files'){content=(r.files||[]).map((p,i)=>`<div class="file"><strong>${esc(p.split('/').pop())}</strong><div class="file-actions"><button onclick="Native.save(lastResult.files[${i}])">Save to device</button><button onclick="Native.share(lastResult.files[${i}])">Share</button></div></div>`).join('');if(r.output_directory)content+=`<p><button class="zip" onclick="Native.exportZip(lastResult.output_directory)">Export this run as ZIP ↗</button></p>`}else{content=(r.warnings||[]).map(w=>'<p class="warn">'+esc(w)+'</p>').join('');if(d.analysis)content+=`<div class="metric"><b>${d.analysis.score}</b><span>/100<br>Local resume score</span></div><h4>Issues & suggestions</h4><pre>${esc(JSON.stringify({issues:d.analysis.issues,suggestions:d.suggestions},null,2))}</pre>`;else if(d.injection)content+='<p class="result-text">'+esc(d.injection.steps.join('\n\n'))+'</p>'+((d.skipped_channels||[]).map(s=>'<p class="warn">'+esc(s)+'</p>').join(''));else content+='<pre>'+esc(JSON.stringify(d,null,2))+'</pre>';content+='<p class="note">Full JSON and report files are available in Saved files. Previews may be shortened.</p>'}document.getElementById('results').innerHTML=`<h3>Results <span class="step">COMPLETE</span></h3><div class="tabs">${['overview','details','files'].map(t=>`<button class="${resultTab===t?'active':''}" onclick="resultTab='${t}';showResult()">${t==='files'?'Saved files':t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>${content}`}
function motionBehavior(){return document.body.classList.contains('reduced')||matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'}
function setPane(pane){document.body.dataset.pane=pane;for(const p of ['setup','results'])document.getElementById('tab-'+p)?.classList.toggle('active',p===pane)}
if(localStorage.getItem('reduced')==='true'){document.body.classList.add('reduced');document.getElementById('motion').checked=true}render();setPane('setup');
</script></body></html>
