plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'com.phantomresume.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.phantomresume.mobile'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '1.3.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('PHANTOM_KEYSTORE') ?: '../signing/release.jks')
            storePassword System.getenv('PHANTOM_STORE_PASSWORD')
            keyAlias 'phantomresume'
            keyPassword System.getenv('PHANTOM_KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true } }
}
chaquopy {
    defaultConfig {
        version '3.12'
        buildPython System.getenv('PHANTOM_BUILD_PYTHON') ?: 'python'
        pip {
            install 'python-docx==1.2.0'
            install 'lxml==5.3.0'
            install 'Pillow==11.0.0'
            install 'PyPDF2==3.0.1'
            install 'reportlab==4.4.4'
            install 'piexif==1.1.3'
            install 'qrcode==8.2'
            install 'mutagen==1.47.0'
            install 'fonttools==4.60.1'
            install 'requests==2.32.5'
            install 'docxcompose==1.4.1'
            install 'colorama==0.4.6'
            install 'cryptography==42.0.8'
        }
        pyc { src = true }
        extractPackages 'docx', 'docxcompose'
    }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.zxing:core:3.5.3'
}
