name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install QR decoder runtime
        run: sudo apt-get update && sudo apt-get install -y libzbar0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test synthetic documents and mocked browsers
        run: python -m unittest discover -s tests -v
      - name: Check private artifact exclusions
        run: python scripts/check_public_files.py
